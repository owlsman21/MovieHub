<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub | Watch Free Movies Online</title>
    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --accent-color: #e50914;
            --gold-accent: #ffdd00;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.5;
            padding-bottom: 50px;
        }

        /* HEADER LAYOUT: Left Logo + Center Stack (Title & Search) + Right Support Button */
        header {
            background-color: rgba(0, 0, 0, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #222;
            gap: 12px;
            position: relative;
        }

        /* Left Side Graphic Logo - Made Bigger */
        .header-logo-img {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            height: 90px; /* Increased from 55px */
            width: auto;
            object-fit: contain;
        }

        /* Centered MovieHub Logo Text - Made Bigger */
        .logo {
            font-size: 42px; /* Increased from 28px */
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            letter-spacing: 1px;
            white-space: nowrap;
            text-align: center;
        }

        /* Search Bar Centered Directly Under Logo Text */
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 320px;
            max-width: 90%;
        }

        .search-container input {
            width: 100%;
            padding: 8px 35px 8px 12px;
            background-color: #000;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            outline: none;
            text-align: center;
        }

        .search-container input:focus {
            border-color: var(--accent-color);
            text-align: left;
        }

        #clear-search {
            position: absolute;
            right: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            display: none;
            font-weight: bold;
        }

        /* Support Us Button Positioned Top-Right */
        .support-btn {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--gold-accent);
            color: #000;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: transform 0.2s ease, background-color 0.2s ease;
            white-space: nowrap;
        }

        .support-btn:hover {
            background-color: #f3ce00;
            transform: translateY(-50%) scale(1.05);
        }

        main {
            padding: 20px 40px;
        }

        .shelf {
            margin-bottom: 40px;
        }

        .shelf h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #fff;
        }

        /* ONE LINE PER SHELF WITH HORIZONTAL SCROLL */
        .shelf-grid {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 10px;
            scroll-behavior: smooth;
        }

        .shelf-grid::-webkit-scrollbar {
            height: 8px;
        }

        .shelf-grid::-webkit-scrollbar-track {
            background: #141414;
        }

        .shelf-grid::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .shelf-grid::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* Search Layout Grid */
        .search-grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            flex: 0 0 160px;
            width: 160px;
        }

        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        .movie-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .movie-card-title {
            padding: 10px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        /* Detail View Layout */
        #movie-detail-view {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
        }

        .movie-detail-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #181818;
            padding: 20px;
            border-radius: 8px;
        }

        .player-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background-color: #000;
            border-radius: 6px;
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .movie-info-header {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .movie-info-header img {
            width: 180px;
            height: 270px;
            object-fit: cover;
            border-radius: 6px;
        }

        .movie-meta {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .movie-meta h1 {
            font-size: 28px;
        }

        .movie-meta-tags {
            display: flex;
            gap: 15px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .movie-description {
            margin-top: 10px;
            line-height: 1.6;
            color: #ddd;
        }

        #back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }
            .header-logo-img {
                position: static;
                transform: none;
                height: 60px;
            }
            .support-btn {
                position: static;
                transform: none;
                margin-top: 5px;
            }
            .support-btn:hover {
                transform: scale(1.05);
            }
            main {
                padding: 15px 20px;
            }
            .movie-info-header {
                flex-direction: column;
            }
            .movie-info-header img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <header>
        <!-- Far Left Graphic Logo (Updated name to moviehub.png) -->
        <a href="/">
            <img src="images/moviehub.png" alt="MovieHub Logo" class="header-logo-img">
        </a>

        <!-- Center Title -->
        <a href="/" class="logo">MovieHub</a>

        <!-- Search Bar Directly Below Center Title -->
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search movies...">
            <span id="clear-search">&times;</span>
        </div>

        <!-- Far Right Support Button -->
        <a href="https://buymeacoffee.com" target="_blank" rel="noopener noreferrer" class="support-btn">
            ☕ Support Us
        </a>
    </header>

    <main>
        <div id="movie-detail-view"></div>
        <div id="shelf-container"></div>
    </main>

    <button id="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">Top</button>

    <script>
        let allMoviesData = []; 

        function getPosterUrl(posterUrl) {
            if (!posterUrl) return 'images/poster-placeholder.jpg';
            if (posterUrl.startsWith('http://') || posterUrl.startsWith('https://')) {
                return posterUrl;
            }
            return posterUrl.replace(/^\/+/, '');
        }

        async function init() {
            try {
                const response = await fetch('/all-movies.json?t=' + new Date().getTime());
                allMoviesData = await response.json();
            } catch (error) {
                console.error("Error loading data:", error);
            }

            checkAndRenderRoute();

            window.addEventListener('popstate', () => {
                checkAndRenderRoute();
            });

            window.addEventListener('scroll', () => {
                const btt = document.getElementById('back-to-top');
                if (btt) btt.style.display = (window.scrollY > 300) ? 'block' : 'none';
            });

            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                
                document.getElementById('movie-detail-view').style.display = 'none';
                document.getElementById('shelf-container').style.display = 'block';

                if (term.length > 0) {
                    clearBtn.style.display = 'block';
                    renderShelves(allMoviesData.filter(m => m.title && m.title.toLowerCase().includes(term)), true); 
                } else {
                    clearBtn.style.display = 'none';
                    renderShelves(allMoviesData, false);
                }
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.style.display = 'none';
                renderShelves(allMoviesData, false);
            });
        }

        function checkAndRenderRoute() {
            const pathname = window.location.pathname;
            const urlParams = new URLSearchParams(window.location.search);
            const queryId = urlParams.get('id');

            let movieId = null;

            if (pathname.startsWith('/movie/')) {
                movieId = pathname.split('/movie/')[1].replace(/\/$/, '');
            } else if (queryId) {
                movieId = queryId;
            }

            if (movieId) {
                renderMovieDetail(movieId);
            } else {
                document.getElementById('movie-detail-view').style.display = 'none';
                document.getElementById('shelf-container').style.display = 'block';
                renderShelves(allMoviesData);
            }
        }

        function openMovieDetail(movieId) {
            history.pushState({ id: movieId }, '', `?id=${movieId}`);
            renderMovieDetail(movieId);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderMovieDetail(id) {
            const movie = allMoviesData.find(m => String(m.id) === String(id));
            const shelfContainer = document.getElementById('shelf-container');
            const detailView = document.getElementById('movie-detail-view');

            if (!movie) {
                shelfContainer.style.display = 'block';
                detailView.style.display = 'none';
                shelfContainer.innerHTML = '<div style="text-align:center; padding: 50px;"><h2>Movie Not Found</h2><a href="/" style="color:#e50914;">Return to Home</a></div>';
                return;
            }

            document.title = `${movie.title} | MovieHub`;

            shelfContainer.style.display = 'none';
            detailView.style.display = 'block';

            const fullPosterUrl = getPosterUrl(movie.posterUrl);

            let embedUrl = '';
            if (movie.source === 'rumble') {
                embedUrl = `https://rumble.com/embed/${movie.embedId}/?pub=4`;
            } else if (movie.source === 'okru' || movie.source === 'ok.ru') {
                embedUrl = `//ok.ru/videoembed/${movie.embedId}`;
            } else if (movie.source === 'youtube') {
                embedUrl = `https://www.youtube.com/embed/${movie.embedId}`;
            } else {
                embedUrl = `https://rumble.com/embed/${movie.embedId}/?pub=4`;
            }

            const genresText = Array.isArray(movie.genres) ? movie.genres.join(', ') : (movie.genres || 'Classic');

            detailView.innerHTML = `
                <div class="movie-detail-container">
                    <div class="player-wrapper">
                        <iframe src="${embedUrl}" allowfullscreen></iframe>
                    </div>
                    <div class="movie-info-header">
                        <img src="${fullPosterUrl}" alt="${movie.title}" onerror="this.src='images/poster-placeholder.jpg'">
                        <div class="movie-meta">
                            <h1>${movie.title}</h1>
                            <div class="movie-meta-tags">
                                <span>${movie.year || 'N/A'}</span>
                                <span>${movie.quality || 'HD'}</span>
                                <span>${genresText}</span>
                            </div>
                            ${movie.director ? `<p><strong>Director:</strong> ${movie.director}</p>` : ''}
                            <p class="movie-description">${movie.description || ''}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function createMovieCard(movie) {
            const card = document.createElement('div');
            card.className = 'movie-card';
            
            card.onclick = () => openMovieDetail(movie.id);

            const img = document.createElement('img');
            img.src = getPosterUrl(movie.posterUrl);
            img.alt = movie.title || 'Movie Poster';
            img.onerror = function() { this.src = 'images/poster-placeholder.jpg'; };

            const title = document.createElement('div');
            title.className = 'movie-card-title';
            title.textContent = movie.title || 'Untitled Movie';

            card.appendChild(img);
            card.appendChild(title);
            return card;
        }

        function renderShelves(movies, isSearch = false) {
            const container = document.getElementById('shelf-container');
            container.innerHTML = '';
            
            if (isSearch) {
                const section = document.createElement('section');
                section.className = 'shelf';
                section.innerHTML = `<h2>Search Results</h2><div class="search-grid-layout" id="search-grid"></div>`;
                container.appendChild(section);
                const grid = document.getElementById('search-grid');
                movies.forEach(m => {
                    grid.appendChild(createMovieCard(m));
                });
            } else {
                const latestAddedSection = document.createElement('section');
                latestAddedSection.className = 'shelf';
                latestAddedSection.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 15px;">
                        <h2>Latest Additions</h2>
                        <a href="/catalog.html" style="color:#e50914; text-decoration:none; font-weight:bold; margin-right:20px;">VIEW ALL ></a>
                    </div>
                    <div class="shelf-grid" id="grid-latest-additions"></div>
                `;
                container.appendChild(latestAddedSection);

                const latestAddedGrid = document.getElementById('grid-latest-additions');
                movies.slice(0, 12).forEach(m => {
                    latestAddedGrid.appendChild(createMovieCard(m));
                });

                const categories = [
                    { title: "New Releases", keywords: ["new"], domId: "latest" },
                    { title: "Classic Cinema", keywords: ["classic"], domId: "classics" },
                    { title: "Film Noir", keywords: ["noir"], domId: "filmnoir" },
                    { title: "Drama Collection", keywords: ["drama"], domId: "drama" },
                    { title: "Biography Selection", keywords: ["biography", "biopic"], domId: "biography" },
                    { title: "History Vault", keywords: ["history", "historical"], domId: "history" },
                    { title: "Sci-Fi Collection", keywords: ["sci-fi", "science fiction"], domId: "scifi" },
                    { title: "War Movies", keywords: ["war"], domId: "war" },
                    { title: "Westerns", keywords: ["western"], domId: "western" },
                    { title: "Horror & Thriller Vault", keywords: ["horror", "thriller"], domId: "horror" },
                    { title: "Action Collection", keywords: ["action"], domId: "action" },
                    { title: "Comedy, Romance & Fantasy", keywords: ["comedy", "romance", "fantasy"], domId: "comedy" },
                    { title: "Bette Davis Collection", keywords: ["bette davis"], domId: "bettedavis" },
                    { title: "Hitchcock Collection", keywords: ["hitchcock"], domId: "hitchcock" }
                ];

                function renderBatch(batch) {
                    batch.forEach(cat => {
                        let filtered = [];

                        if (cat.keywords.includes("new")) {
                            filtered = movies
                                .filter(m => parseInt(m.year, 10) >= 2024)
                                .sort((a, b) => (parseInt(b.year, 10) || 0) - (parseInt(a.year, 10) || 0));
                        } else if (cat.domId === "classics") {
                            filtered = movies.filter(m => {
                                const titleText = (m.title || '').toLowerCase();
                                const genreText = Array.isArray(m.genres) 
                                    ? m.genres.join(' ').toLowerCase() 
                                    : (m.genres || '').toLowerCase();
                                const yr = parseInt(m.year, 10) || 0;
                                const isNoir = titleText.includes('noir') || genreText.includes('noir');
                                
                                return !isNoir && yr > 0 && yr < 1980;
                            });
                        } else if (cat.domId === "filmnoir") {
                            filtered = movies.filter(m => {
                                const titleText = (m.title || '').toLowerCase();
                                const genreText = Array.isArray(m.genres) 
                                    ? m.genres.join(' ').toLowerCase() 
                                    : (m.genres || '').toLowerCase();
                                const yr = parseInt(m.year, 10) || 0;
                                const isNoir = titleText.includes('noir') || genreText.includes('noir');

                                return isNoir && (yr === 0 || yr < 1960);
                            });
                        } else {
                            filtered = movies.filter(m => {
                                const titleText = (m.title || '').toLowerCase();
                                const genreText = Array.isArray(m.genres) 
                                    ? m.genres.join(' ').toLowerCase() 
                                    : (m.genres || '').toLowerCase();
                                
                                return cat.keywords.some(kw => 
                                    titleText.includes(kw) || genreText.includes(kw)
                                );
                            });
                        }

                        if (filtered.length === 0) return;
                        
                        const section = document.createElement('section');
                        section.className = 'shelf';
                        section.innerHTML = `
                            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 15px;">
                                <h2>${cat.title}</h2>
                                <a href="/category.html?q=${encodeURIComponent(cat.keywords[0])}" style="color:#e50914; text-decoration:none; font-weight:bold; margin-right:20px;">VIEW ALL ></a>
                            </div>
                            <div class="shelf-grid" id="grid-${cat.domId}"></div>
                        `;
                        container.appendChild(section);
                        const grid = document.getElementById(`grid-${cat.domId}`);
                        
                        filtered.slice(0, 12).forEach(m => {
                            grid.appendChild(createMovieCard(m));
                        });
                    });
                }
                
                renderBatch(categories.slice(0, 3)); 
                setTimeout(() => renderBatch(categories.slice(3)), 100); 
            }
        }

        init();
    </script>
</body>
</html>
