<!DOCTYPE html>
<html lang="en">
<head>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MovieHub" />
    <meta property="og:url" content="https://moviehub.uk/" />
    <meta property="og:title" content="MovieHub — Classic Cinema, Film Noir & Cult Classics" />
    <meta property="og:description" content="Stream restored classic films, Film Noir, Westerns, horror, and rare cinema online at MovieHub." />
    <meta property="og:image" content="https://moviehub.uk/images/og-default.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/images/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d0f14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WY3DHDXQWH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-WY3DHDXQWH');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub | Watch Free Movies Online</title>
    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --accent-color: #e50914;
            --gold-accent: #ffdd00;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.5;
            padding-bottom: 50px;
        }

        /* COMPACT HEADER: Left Logo + Centered Title + Search Row (Share | Search | Support Us) */
        header {
            background-color: rgba(0, 0, 0, 0.96);
            padding: 10px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #222;
            gap: 8px;
            position: relative;
        }

        .header-logo-img {
            position: absolute;
            left: 32px;
            top: 50%;
            transform: translateY(-50%);
            height: 68px;
            width: auto;
            object-fit: contain;
        }

        .logo {
            font-size: 33px;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            letter-spacing: 0.8px;
            line-height: 1.1;
            white-space: nowrap;
            text-align: center;
        }

        .search-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 680px;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1 1 280px;
            max-width: 340px;
        }

        .search-container input {
            width: 100%;
            padding: 8px 34px 8px 12px;
            background-color: #1a1a1a;
            border: 1px solid var(--gold-accent);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .search-container input::placeholder {
            color: #bbbbbb;
        }

        .search-container input:focus {
            background-color: #222222;
            border-color: #ffe84d;
            box-shadow: 0 0 0 2px rgba(255, 221, 0, 0.28);
            text-align: left;
        }

        #clear-search {
            position: absolute;
            right: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            display: none;
            font-weight: bold;
        }

        @keyframes supportWiggle {
            0%, 82%, 100% {
                transform: rotate(0deg);
            }
            86% {
                transform: rotate(-3deg);
            }
            90% {
                transform: rotate(3deg);
            }
            94% {
                transform: rotate(-2deg);
            }
            98% {
                transform: rotate(2deg);
            }
        }

        .header-share-btn,
        .support-btn {
            height: 35px;
            padding: 0 13px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            white-space: nowrap;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .header-share-btn {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid var(--gold-accent);
        }

        .header-share-btn:hover {
            background-color: var(--gold-accent);
            color: #000000;
            transform: scale(1.03);
        }

        .support-btn {
            background-color: var(--gold-accent);
            color: #000000;
            border: 1px solid var(--gold-accent);
            box-shadow: 0 2px 10px rgba(255, 221, 0, 0.25);
            animation: supportWiggle 4.5s infinite ease-in-out;
        }

        .support-btn:hover {
            background-color: #ffe84d;
            border-color: #ffe84d;
            box-shadow: 0 4px 16px rgba(255, 221, 0, 0.5);
            animation: none;
            transform: scale(1.04);
        }

        .header-install-inline {
            position: absolute;
            right: 32px;
            top: 14px;
            height: 30px;
            padding: 0 11px;
            border-radius: 5px;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid var(--gold-accent);
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .header-install-inline:hover {
            background-color: var(--gold-accent);
            color: #000000;
        }

        main {
            padding: 14px 32px 20px;
        }

        .results-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .results-count {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .reset-filter-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 5px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .reset-filter-btn:hover {
            background-color: #f6121d;
        }

        .empty-state {
            background-color: #1a1a1a;
            border: 1px solid #2f2f2f;
            border-radius: 8px;
            padding: 36px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .shelf {
            margin-bottom: 34px;
        }

        .shelf h2 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #fff;
        }

        /* SHELF SCROLL WRAPPER & LEFT/RIGHT ARROWS */
        .shelf-row-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .shelf-scroll-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            width: 40px;
            height: 76px;
            border-radius: 6px;
            border: 1px solid rgba(255, 221, 0, 0.45);
            background-color: rgba(15, 15, 15, 0.88);
            color: #ffffff;
            font-size: 28px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.75);
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
        }

        .shelf-scroll-btn:hover:not(:disabled) {
            background-color: var(--gold-accent);
            color: #000000;
            border-color: var(--gold-accent);
            transform: translateY(-50%) scale(1.05);
        }

        .shelf-scroll-btn:disabled {
            opacity: 0.22;
            cursor: default;
        }

        .shelf-scroll-btn.prev {
            left: 6px;
        }

        .shelf-scroll-btn.next {
            right: 6px;
        }

        /* ONE LINE PER SHELF WITH HORIZONTAL SCROLL */
        .shelf-grid {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 10px;
            scroll-behavior: smooth;
            width: 100%;
            scrollbar-width: none;
        }

        .shelf-grid::-webkit-scrollbar {
            display: none;
        }

        /* Search / Filtered Layout Grid */
        .search-grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .movie-card-wrap {
            background-color: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            flex: 0 0 160px;
            width: 160px;
            display: flex;
            flex-direction: column;
        }

        .search-grid-layout .movie-card-wrap {
            width: 100%;
            flex: initial;
        }

        .movie-card-wrap:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        .movie-card-link {
            text-decoration: none;
            color: var(--text-color);
            display: block;
        }

        .movie-card-link img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .movie-card-title {
            padding: 8px 10px 4px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            font-weight: 600;
        }

        .watchlist-toggle-btn {
            margin: 4px 10px 10px;
            padding: 5px 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #262626;
            color: #e4e4e7;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .watchlist-toggle-btn:hover {
            border-color: var(--gold-accent);
            color: #ffffff;
        }

        .watchlist-toggle-btn.saved {
            background-color: var(--gold-accent);
            color: #000000;
            border-color: var(--gold-accent);
        }

        #back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 900px) {
            header {
                padding: 10px 16px;
            }
            .header-logo-img {
                position: static;
                transform: none;
                height: 52px;
            }
            .header-install-inline {
                position: static;
                margin-top: 2px;
            }
            .search-row {
                flex-wrap: wrap;
                justify-content: center;
            }
            .search-container {
                order: -1;
                flex: 1 1 100%;
                max-width: 340px;
            }
            .support-btn {
                animation: none;
            }
            main {
                padding: 12px 16px 20px;
            }
            .shelf-scroll-btn {
                width: 32px;
                height: 60px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="/">
            <img src="images/moviehub.png" alt="MovieHub Logo" class="header-logo-img">
        </a>

        <button id="header-install-btn" type="button" class="header-install-inline">
            📲 Install App
        </button>

        <a href="/" class="logo">MovieHub</a>

        <div class="search-row">
            <button type="button" id="header-share-btn" class="header-share-btn" title="Share MovieHub with friends">
                📤 Share
            </button>

            <div class="search-container">
                <input type="text" id="search-input" placeholder="🔍 Search movies, cast, year...">
                <span id="clear-search">&times;</span>
            </div>

            <a href="https://buymeacoffee.com" target="_blank" rel="noopener noreferrer" class="support-btn" title="Enjoying the free classics? Support MovieHub">
                ☕ Support Us
            </a>
        </div>
    </header>

    <main>
        <div id="shelf-container"></div>
    </main>

    <button id="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">Top</button>

    <script>
        const WATCHLIST_KEY = 'moviehub_watchlist_v1';
        let allMoviesData = [];
        let currentEra = 'all';

        function getWatchlistIds() {
            try {
                const raw = localStorage.getItem(WATCHLIST_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function saveWatchlistIds(ids) {
            try {
                localStorage.setItem(WATCHLIST_KEY, JSON.stringify(ids));
            } catch (e) {}
        }

        function toggleWatchlist(movieId) {
            const cleanId = String(movieId || '');
            if (!cleanId) return;
            const list = getWatchlistIds();
            const idx = list.indexOf(cleanId);
            if (idx >= 0) {
                list.splice(idx, 1);
            } else {
                list.unshift(cleanId);
            }
            saveWatchlistIds(list);
            applyCurrentView();
        }

        function matchesEra(movie, era) {
            if (!era || era === 'all') return true;
            const yr = parseInt(movie.year, 10) || 0;
            if (!yr) return false;
            if (era === 'precode') return yr < 1935;
            if (era === '1930s') return yr >= 1930 && yr <= 1939;
            if (era === '1940s') return yr >= 1940 && yr <= 1949;
            if (era === '1950s') return yr >= 1950 && yr <= 1959;
            if (era === '1960plus') return yr >= 1960;
            return true;
        }

        function getEraLabel(era) {
            const labels = {
                precode: 'Pre-Code (Pre-1935)',
                '1930s': '1930s',
                '1940s': '1940s',
                '1950s': '1950s',
                '1960plus': '1960s+'
            };
            return labels[era] || '';
        }

        function getPosterUrl(posterUrl) {
            if (!posterUrl) return 'images/poster-placeholder.jpg';
            if (posterUrl.startsWith('http://') || posterUrl.startsWith('https://')) {
                return posterUrl;
            }
            return posterUrl.replace(/^\/+/, '');
        }

        function sanitizeFilename(name) {
            if (!name) return '';
            return String(name).replace(/[:\\/*?"<>|]/g, '-');
        }

        function createMovieCard(movie) {
            const safeId = sanitizeFilename(movie.id);
            const rawId = String(movie.id || '');
            const isSaved = getWatchlistIds().includes(rawId);

            const wrap = document.createElement('div');
            wrap.className = 'movie-card-wrap';

            const link = document.createElement('a');
            link.className = 'movie-card-link';
            link.href = `/movie-details.html?id=${encodeURIComponent(safeId)}`;

            const img = document.createElement('img');
            img.src = getPosterUrl(movie.posterUrl);
            img.alt = movie.title || 'Movie Poster';
            img.onerror = function() { this.src = 'images/poster-placeholder.jpg'; };

            const title = document.createElement('div');
            title.className = 'movie-card-title';
            title.textContent = movie.title || 'Untitled Movie';

            link.appendChild(img);
            link.appendChild(title);

            const saveBtn = document.createElement('button');
            saveBtn.type = 'button';
            saveBtn.className = 'watchlist-toggle-btn' + (isSaved ? ' saved' : '');
            saveBtn.textContent = isSaved ? '✓ Saved' : '+ Watchlist';
            saveBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleWatchlist(rawId);
            });

            wrap.appendChild(link);
            wrap.appendChild(saveBtn);
            return wrap;
        }

        function attachShelfScrollArrows(grid) {
            if (!grid || !grid.parentElement) return;
            const wrap = grid.parentElement;
            if (wrap.querySelector('.shelf-scroll-btn')) return;

            const prevBtn = document.createElement('button');
            prevBtn.type = 'button';
            prevBtn.className = 'shelf-scroll-btn prev';
            prevBtn.setAttribute('aria-label', 'Scroll row left');
            prevBtn.innerHTML = '&#8249;';

            const nextBtn = document.createElement('button');
            nextBtn.type = 'button';
            nextBtn.className = 'shelf-scroll-btn next';
            nextBtn.setAttribute('aria-label', 'Scroll row right');
            nextBtn.innerHTML = '&#8250;';

            function updateButtons() {
                const maxScroll = grid.scrollWidth - grid.clientWidth;
                if (maxScroll <= 4) {
                    prevBtn.style.display = 'none';
                    nextBtn.style.display = 'none';
                    return;
                }
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
                prevBtn.disabled = grid.scrollLeft <= 2;
                nextBtn.disabled = grid.scrollLeft >= maxScroll - 2;
            }

            prevBtn.addEventListener('click', () => {
                const step = Math.max(360, Math.floor(grid.clientWidth * 0.8));
                grid.scrollBy({ left: -step, behavior: 'smooth' });
            });

            nextBtn.addEventListener('click', () => {
                const step = Math.max(360, Math.floor(grid.clientWidth * 0.8));
                grid.scrollBy({ left: step, behavior: 'smooth' });
            });

            grid.addEventListener('scroll', updateButtons, { passive: true });
            window.addEventListener('resize', updateButtons, { passive: true });

            wrap.appendChild(prevBtn);
            wrap.appendChild(nextBtn);
            requestAnimationFrame(updateButtons);
        }

        function applyCurrentView() {
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');
            const term = (searchInput ? searchInput.value : '').toLowerCase().trim();

            if (clearBtn) {
                clearBtn.style.display = term.length > 0 ? 'block' : 'none';
            }

            const hasSearch = term.length > 0;
            const hasEra = currentEra !== 'all';

            if (hasSearch || hasEra) {
                const filtered = allMoviesData.filter(m => {
                    if (!matchesEra(m, currentEra)) return false;
                    if (!hasSearch) return true;
                    const titleMatch = String(m.title || '').toLowerCase().includes(term);
                    const directorMatch = String(m.director || '').toLowerCase().includes(term);
                    const yearMatch = String(m.year || '').toLowerCase().includes(term);
                    const castText = Array.isArray(m.cast) ? m.cast.join(' ') : String(m.cast || '');
                    const castMatch = castText.toLowerCase().includes(term);
                    return titleMatch || directorMatch || yearMatch || castMatch;
                });

                renderFilteredResults(filtered, term, currentEra);
            } else {
                renderShelves(allMoviesData);
            }
        }

        function resetAllFilters() {
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');
            if (searchInput) searchInput.value = '';
            if (clearBtn) clearBtn.style.display = 'none';
            currentEra = 'all';
            renderShelves(allMoviesData);
        }

        function renderFilteredResults(movies, term, era) {
            const container = document.getElementById('shelf-container');
            container.innerHTML = '';

            const section = document.createElement('section');
            section.className = 'shelf';

            const headingText = term
                ? `Search Results for "${term}"`
                : `${getEraLabel(era)} Collection`;

            const countLabel = `${movies.length} ${movies.length === 1 ? 'movie' : 'movies'} found${era !== 'all' && term ? ' in ' + getEraLabel(era) : ''}`;

            const metaDiv = document.createElement('div');
            metaDiv.className = 'results-meta';
            metaDiv.innerHTML = `
                <div>
                    <h2 style="margin-bottom: 4px;">${headingText}</h2>
                    <div class="results-count">${countLabel}</div>
                </div>
            `;

            const resetBtn = document.createElement('button');
            resetBtn.type = 'button';
            resetBtn.className = 'reset-filter-btn';
            resetBtn.textContent = 'Clear Filter';
            resetBtn.addEventListener('click', resetAllFilters);
            metaDiv.appendChild(resetBtn);

            section.appendChild(metaDiv);

            if (movies.length === 0) {
                const emptyBox = document.createElement('div');
                emptyBox.className = 'empty-state';
                emptyBox.innerHTML = `
                    <h3>No matching films found</h3>
                    <p>Try searching a different title, actor, director, or year, or clear the active filter.</p>
                `;
                section.appendChild(emptyBox);
            } else {
                const grid = document.createElement('div');
                grid.className = 'search-grid-layout';
                movies.forEach(m => grid.appendChild(createMovieCard(m)));
                section.appendChild(grid);
            }

            container.appendChild(section);
        }

        function appendLatestAdditions(container, movies) {
            const latestAddedSection = document.createElement('section');
            latestAddedSection.className = 'shelf';
            latestAddedSection.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 12px;">
                    <h2>Latest Additions</h2>
                    <a href="/catalog.html" style="color:#e50914; text-decoration:none; font-weight:bold; margin-right:20px;">VIEW ALL ></a>
                </div>
                <div class="shelf-row-wrap">
                    <div class="shelf-grid" id="grid-latest-additions"></div>
                </div>
            `;
            container.appendChild(latestAddedSection);

            const latestAddedGrid = document.getElementById('grid-latest-additions');
            movies.slice(0, 12).forEach(m => {
                latestAddedGrid.appendChild(createMovieCard(m));
            });
            attachShelfScrollArrows(latestAddedGrid);
        }

        function renderShelves(movies) {
            const container = document.getElementById('shelf-container');
            container.innerHTML = '';

            // 1. My Watchlist (if user has saved items)
            const watchlistIds = getWatchlistIds();
            if (watchlistIds.length > 0) {
                const savedMovies = watchlistIds
                    .map(id => movies.find(m => String(m.id || '') === String(id)))
                    .filter(Boolean);

                if (savedMovies.length > 0) {
                    const watchlistSection = document.createElement('section');
                    watchlistSection.className = 'shelf';
                    watchlistSection.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 12px;">
                            <h2>My Watchlist (${savedMovies.length})</h2>
                        </div>
                        <div class="shelf-row-wrap">
                            <div class="shelf-grid" id="grid-watchlist"></div>
                        </div>
                    `;
                    container.appendChild(watchlistSection);
                    const watchlistGrid = document.getElementById('grid-watchlist');
                    savedMovies.forEach(m => watchlistGrid.appendChild(createMovieCard(m)));
                    attachShelfScrollArrows(watchlistGrid);
                }
            }

            // 2. Top Picks (movies with "topPick": "Y")
            const topPicks = movies.filter(m =>
                String(m.topPick || '').trim().toUpperCase() === 'Y'
            );

            if (topPicks.length > 0) {
                const topPicksSection = document.createElement('section');
                topPicksSection.className = 'shelf';
                topPicksSection.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 12px;">
                        <h2>Top Picks</h2>
                    </div>
                    <div class="shelf-row-wrap">
                        <div class="shelf-grid" id="grid-top-picks"></div>
                    </div>
                `;
                container.appendChild(topPicksSection);
                const topPicksGrid = document.getElementById('grid-top-picks');
                topPicks.forEach(m => {
                    topPicksGrid.appendChild(createMovieCard(m));
                });
                attachShelfScrollArrows(topPicksGrid);
            }

            // 3. New Releases (rendered first)
            const newReleasesCat = { title: "New Releases", keywords: ["new"], domId: "latest" };
            const newReleasesList = movies
                .filter(m => parseInt(m.year, 10) >= 2024)
                .sort((a, b) => (parseInt(b.year, 10) || 0) - (parseInt(a.year, 10) || 0));

            if (newReleasesList.length > 0) {
                const newSection = document.createElement('section');
                newSection.className = 'shelf';
                newSection.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 12px;">
                        <h2>${newReleasesCat.title}</h2>
                        <a href="/category.html?q=${encodeURIComponent(newReleasesCat.keywords[0])}" style="color:#e50914; text-decoration:none; font-weight:bold; margin-right:20px;">VIEW ALL ></a>
                    </div>
                    <div class="shelf-row-wrap">
                        <div class="shelf-grid" id="grid-${newReleasesCat.domId}"></div>
                    </div>
                `;
                container.appendChild(newSection);
                const newGrid = document.getElementById(`grid-${newReleasesCat.domId}`);
                newReleasesList.slice(0, 12).forEach(m => {
                    newGrid.appendChild(createMovieCard(m));
                });
                attachShelfScrollArrows(newGrid);
            }

            // 4. Latest Additions (placed right after New Releases)
            appendLatestAdditions(container, movies);

            // 5. Remaining category shelves
            const categories = [
                { title: "Classic Cinema", keywords: ["classic"], domId: "classics" },
                { title: "Film Noir", keywords: ["noir"], domId: "filmnoir" },
                { title: "Drama Collection", keywords: ["drama"], domId: "drama" },
                { title: "Biography Selection", keywords: ["biography", "biopic"], domId: "biography" },
                { title: "History Vault", keywords: ["history", "historical"], domId: "history" },
                { title: "Sci-Fi Collection", keywords: ["sci-fi", "science fiction"], domId: "scifi" },
                { title: "War Movies", keywords: ["war"], domId: "war" },
                { title: "Westerns", keywords: ["western"], domId: "western" },
                { title: "Horror & Thriller Vault", keywords: ["horror", "thriller"], domId: "horror" },
                { title: "Action Collection", keywords: ["action"], domId: "action" },
                { title: "Comedy, Romance & Fantasy", keywords: ["comedy", "romance", "fantasy"], domId: "comedy" },
                { title: "Bette Davis Collection", keywords: ["bette davis"], domId: "bettedavis" },
                { title: "Hitchcock Collection", keywords: ["hitchcock"], domId: "hitchcock" }
            ];

            function renderBatch(batch) {
                batch.forEach(cat => {
                    let filtered = [];

                    if (cat.domId === "classics") {
                        filtered = movies.filter(m => {
                            const titleText = (m.title || '').toLowerCase();
                            const genreText = Array.isArray(m.genres)
                                ? m.genres.join(' ').toLowerCase()
                                : (m.genres || '').toLowerCase();
                            const yr = parseInt(m.year, 10) || 0;
                            const isNoir = titleText.includes('noir') || genreText.includes('noir');

                            return !isNoir && yr > 0 && yr < 1980;
                        });
                    } else if (cat.domId === "filmnoir") {
                        filtered = movies.filter(m => {
                            const titleText = (m.title || '').toLowerCase();
                            const genreText = Array.isArray(m.genres)
                                ? m.genres.join(' ').toLowerCase()
                                : (m.genres || '').toLowerCase();
                            const yr = parseInt(m.year, 10) || 0;
                            const isNoir = titleText.includes('noir') || genreText.includes('noir');

                            return isNoir && (yr === 0 || yr < 1960);
                        });
                    } else {
                        filtered = movies.filter(m => {
                            const titleText = (m.title || '').toLowerCase();
                            const genreText = Array.isArray(m.genres)
                                ? m.genres.join(' ').toLowerCase()
                                : (m.genres || '').toLowerCase();

                            return cat.keywords.some(kw =>
                                titleText.includes(kw) || genreText.includes(kw)
                            );
                        });
                    }

                    if (filtered.length === 0) return;

                    const section = document.createElement('section');
                    section.className = 'shelf';
                    section.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 12px;">
                            <h2>${cat.title}</h2>
                            <a href="/category.html?q=${encodeURIComponent(cat.keywords[0])}" style="color:#e50914; text-decoration:none; font-weight:bold; margin-right:20px;">VIEW ALL ></a>
                        </div>
                        <div class="shelf-row-wrap">
                            <div class="shelf-grid" id="grid-${cat.domId}"></div>
                        </div>
                    `;
                    container.appendChild(section);
                    const grid = document.getElementById(`grid-${cat.domId}`);

                    filtered.slice(0, 12).forEach(m => {
                        grid.appendChild(createMovieCard(m));
                    });
                    attachShelfScrollArrows(grid);
                });
            }

            renderBatch(categories.slice(0, 3));
            setTimeout(() => renderBatch(categories.slice(3)), 100);
        }

        async function init() {
            try {
                const response = await fetch('/all-movies.json?t=' + new Date().getTime());
                allMoviesData = await response.json();
            } catch (error) {
                console.error("Error loading data:", error);
            }

            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');
            if (searchInput) {
                searchInput.addEventListener('input', applyCurrentView);
            }
            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    if (searchInput) searchInput.value = '';
                    applyCurrentView();
                });
            }

            renderShelves(allMoviesData);

            window.addEventListener('scroll', () => {
                const btt = document.getElementById('back-to-top');
                if (btt) btt.style.display = (window.scrollY > 300) ? 'block' : 'none';
            });

            const headerShareBtn = document.getElementById('header-share-btn');
            if (headerShareBtn) {
                headerShareBtn.addEventListener('click', async () => {
                    const shareData = {
                        title: 'MovieHub | Watch Free Classic Movies Online',
                        text: 'Watch free classic cinema, film noir, and golden-age mysteries on MovieHub:',
                        url: 'https://moviehub.uk/'
                    };
                    if (navigator.share) {
                        try {
                            await navigator.share(shareData);
                            return;
                        } catch (err) {
                            if (err && err.name === 'AbortError') return;
                        }
                    }
                    try {
                        await navigator.clipboard.writeText(shareData.url);
                        const orig = headerShareBtn.textContent;
                        headerShareBtn.textContent = '✓ Link Copied!';
                        setTimeout(() => { headerShareBtn.textContent = orig; }, 2000);
                    } catch (err) {}
                });
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
