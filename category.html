<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WY3DHDXQWH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-WY3DHDXQWH');
    </script>
    <meta charset="UTF-8">
    <title>MovieHub | Category</title>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-top: 20px; }
        .grid img { width: 100%; height: 240px; border-radius: 6px; object-fit: cover; cursor: pointer; background: #111; }
        .pagination { margin-top: 30px; text-align: center; }
        .pagination button { padding: 10px 20px; cursor: pointer; background: #e50914; color: white; border: none; border-radius: 5px; margin: 0 5px; }
        .pagination button:disabled { background: #333; cursor: not-allowed; }
    </style>
</head>
<body>
    <a href="index.html" style="color: #ffd700; text-decoration: none;">← BACK TO HOME</a>
    <h1 id="cat-title">Loading...</h1>
    <div class="grid" id="movie-grid"></div>
    
    <div class="pagination" id="pagination">
        <button id="prev-btn" onclick="changePage(-1)">Previous</button>
        <span id="page-info" style="margin: 0 15px;"></span>
        <button id="next-btn" onclick="changePage(1)">Next</button>
    </div>

    <script>
        let movies = [];
        let filtered = [];
        let currentPage = 1;
        const itemsPerPage = 18;

        async function initCategory() {
            const params = new URLSearchParams(window.location.search);
            const keyword = (params.get('q') || params.get('genre') || '').toLowerCase().trim();
            
            const titleKeyword = params.get('q') || params.get('genre') || 'Full Movie';
            document.getElementById('cat-title').innerText = `${titleKeyword.charAt(0).toUpperCase() + titleKeyword.slice(1)} Collection`;

            try {
                // Fixed path to look in the root folder where all-movies.json actually lives
                const response = await fetch('all-movies.json');
                if (!response.ok) throw new Error("Could not load movies database");
                movies = await response.json();

                filtered = keyword === '' || keyword === 'all'
                    ? movies 
                    : movies.filter(m => {
                        const titleMatch = m.title && m.title.toLowerCase().includes(keyword);
                        
                        if (!m.genres) return titleMatch;
                        
                        const genreString = Array.isArray(m.genres) 
                            ? m.genres.join(', ').toLowerCase() 
                            : String(m.genres).toLowerCase();

                        if (keyword === 'noir' || keyword === 'film noir') {
                            return titleMatch || genreString.includes('noir');
                        }
                        if (keyword.includes('classic')) {
                            return titleMatch || genreString.includes('classic');
                        }

                        return titleMatch || genreString.includes(keyword);
                    });

                renderPage();
            } catch (err) {
                console.error("Category Load Error:", err);
                document.getElementById('cat-title').innerText = "Error Loading Collection";
            }
        }

        function renderPage() {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filtered.slice(start, end);
            
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';
            
            if (paginatedItems.length === 0) {
                grid.innerHTML = '<p>No movies found in this collection.</p>';
            }

            paginatedItems.forEach(m => {
                const img = document.createElement('img');
                img.src = m.posterUrl;
                img.onclick = () => window.location.href = `movie-details.html?id=${m.id}`;
                img.onerror = function() { this.src = 'https://via.placeholder.com/300x450?text=Poster+Missing'; };
                grid.appendChild(img);
            });

            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            document.getElementById('page-info').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages;
        }

        function changePage(direction) {
            currentPage += direction;
            renderPage();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        initCategory();
    </script>
</body>
</html>
