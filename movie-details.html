<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta id="meta-description" name="description" content="Stream fully restored classic cinema collections, Hollywood golden era westerns, vintage film noir, and rare horror movies completely free on MovieHub.">
    
    <!-- REMOVED: Static canonical tag pointing to base movie-details.html -->

    <title>Watch Classic Movies Free | MovieHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0a0a0a; color: white; font-family: sans-serif; margin: 0; }
        #wrapper { position: relative; width: 100%; max-width: 850px; margin: 0 auto; background: #000; aspect-ratio: 16 / 9; overflow: hidden; }
        #movie-iframe { width: 100%; height: 100%; border: none; }
        #mega-shield { position: absolute; top: 0; right: 0; width: 25%; height: 20%; z-index: 10; background: transparent; cursor: default; display: none; }
        .related-section { margin-top: 40px; padding: 20px; }
        .related-grid { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 20px; }
        .related-grid a img { width: 150px; height: 225px; object-fit: cover; border-radius: 8px; transition: 0.3s; }
        .related-grid a img:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <header class="main-header">
        <h2>Movie<span>Hub</span></h2>
        <div class="nav-buttons">
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="catalog.html"><i class="fas fa-film"></i> All Movies</a>
        </div>
    </header>

    <main class="content">
        <div id="wrapper">
            <div id="mega-shield"></div>
            <iframe id="movie-iframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>

        <div class="movie-info-block" style="margin-top:20px; background:#1a1a1a; padding:20px; border-radius:8px;">
            <h1 id="movie-title">Classic Movie Stream</h1>
            <p id="movie-meta" style="color:#e50914; font-weight:bold; margin: 10px 0;">Restored Golden Age Cinema</p>
            <div id="movie-desc" style="line-height:1.6; color:#ccc;">
                Loading full feature presentation details...
            </div>
            
            <noscript>
                <p>This movie stream requires JavaScript to load data dynamically. Please enable JavaScript in your browser to view our classic cinema archive.</p>
            </noscript>
        </div>

        <div class="related-section">
            <h3>You Might Also Like</h3>
            <div id="related-grid" class="related-grid"></div>
        </div>
    </main>

    <script>
        async function loadMovieDetails() {
            const params = new URLSearchParams(window.location.search);
            const movieId = params.get('id');
            if (!movieId) return;

            // Dynamically create self-referential canonical for the full URL (including ID)
            let canonicalTag = document.querySelector("link[rel='canonical']");
            if (!canonicalTag) {
                canonicalTag = document.createElement('link');
                canonicalTag.setAttribute('rel', 'canonical');
                document.head.appendChild(canonicalTag);
            }
            canonicalTag.setAttribute('href', window.location.origin + window.location.pathname + '?id=' + movieId);

            try {
                // Fetch JSON without cache-busting timestamp so Googlebot can cache the response
                const response = await fetch('all-movies.json');
                const movies = await response.json();
                const movie = movies.find(m => m.id === movieId);
                
                if (movie) {
                    const cleanTitle = movie.title ? movie.title.split('|')[0].trim() : 'Movie';
                    const iframe = document.getElementById('movie-iframe');
                    let embedUrl = "";

                    if (movie.source === "mega") {
                        embedUrl = movie.embedId.replace("/file/", "/embed/");
                        document.getElementById('mega-shield').style.display = "block";
                    } else if (movie.source === "ok.ru") {
                        embedUrl = `https://ok.ru/videoembed/${movie.embedId}`;
                    } else {
                        embedUrl = `https://rumble.com/embed/${movie.embedId}/?pub=4`;
                    }
                    iframe.src = embedUrl;

                    // Update Title & Meta Description
                    document.title = `${cleanTitle} (${movie.year || ''}) Full Movie | MovieHub`;
                    
                    const metaDescriptionElement = document.getElementById('meta-description');
                    if (metaDescriptionElement && movie.description) {
                        metaDescriptionElement.setAttribute('content', movie.description.substring(0, 155).trim() + '...');
                    }

                    // Interface Content Population
                    document.getElementById('movie-title').innerText = cleanTitle;
                    document.getElementById('movie-meta').innerText = `${movie.year || 'N/A'} | ${movie.quality || 'HD'} | ${movie.genres || 'Classics'}`;
                    document.getElementById('movie-desc').innerText = movie.description;

                    // Inject Structured Data (VideoObject Schema)
                    const script = document.createElement('script');
                    script.type = 'application/ld+json';
                    script.textContent = JSON.stringify({
                        "@context": "https://schema.org",
                        "@type": "VideoObject",
                        "name": cleanTitle,
                        "description": movie.description,
                        "thumbnailUrl": [movie.posterUrl],
                        "uploadDate": movie.year ? `${movie.year}-01-01T08:00:00+00:00` : "1950-01-01T08:00:00+00:00",
                        "contentUrl": window.location.href,
                        "embedUrl": embedUrl,
                        "publisher": {
                            "@type": "Organization",
                            "name": "MovieHub",
                            "logo": { "@type": "ImageObject", "url": "https://moviehub.uk/logo.png" }
                        }
                    });
                    document.head.appendChild(script);

                    renderRelatedMovies(movies, movie);
                } else {
                    document.getElementById('movie-meta').innerText = "Movie not found in the vault selection.";
                }
            } catch (e) { 
                console.error("Error loading movie:", e); 
                document.getElementById('movie-meta').innerText = "Error loading data.";
            }
        }

        function renderRelatedMovies(allMovies, currentMovie) {
            const grid = document.getElementById('related-grid');
            grid.innerHTML = '';
            
            if (!currentMovie.genres) return;
            
            const targetGenres = currentMovie.genres.split(',').map(g => g.trim().toLowerCase());
            
            const related = allMovies.filter(m => {
                if (m.id === currentMovie.id || !m.genres) return false;
                const movieGenres = m.genres.split(',').map(g => g.trim().toLowerCase());
                return movieGenres.some(g => targetGenres.includes(g));
            });

            related.slice(0, 6).forEach(m => {
                const link = document.createElement('a');
                link.href = `movie-details.html?id=${m.id}`;
                
                const img = document.createElement('img');
                img.src = m.posterUrl;
                img.alt = m.title || "Recommended Movie";
                img.onerror = function() { this.src = 'images/poster-placeholder.jpg'; };
                
                link.appendChild(img);
                grid.appendChild(link);
            });
        }

        loadMovieDetails();
    </script>
</body>
</html>
